<div id="cccApp">
  <!-- Header & Filters -->
  <header class="ccc-hero">
    <div class="ccc-topRow" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h1 class="ccc-title" style="margin:0; font-size:22px;">Contract Command Center <span id="adminBadge" class="badge" style="display:none;">ADMIN</span></h1>
        <div id="cccMeta" class="ccc-sub">League Roster Analysis</div>
      </div>
      <div class="ccc-nav">
        <button id="moduleMymChip" class="ccc-btn" data-tool="mym">MYM Assistant</button>
        <button id="refreshBtn" class="ccc-btn">Refresh</button>
      </div>
    </div>

    <div class="ccc-controls-grid">
      <div class="ccc-field">
        League Year
        <select id="seasonSelect" class="ccc-select"></select>
      </div>
      <div class="ccc-field">
        Team
        <select id="teamSelect" class="ccc-select"></select>
      </div>
      <div class="ccc-field">
        Position
        <select id="positionSelect" class="ccc-select"></select>
      </div>
      <div class="ccc-field">
        Search Player
        <input id="searchBox" class="ccc-input" placeholder="Enter name..." />
      </div>
      <div class="ccc-field" style="flex-direction:row; align-items:center; gap:10px;">
        <label class="ccc-check"><input id="showAllTeamsChk" type="checkbox" /> All Teams</label>
        <button id="clearBtn" class="ccc-btn" style="padding: 5px 10px; font-size: 11px;">Clear Filters</button>
      </div>
    </div>
  </header>

  <!-- Summary Cards -->
  <div id="summary" class="ccc-stats-bar" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:15px; margin-top:20px;">
    <!-- Injected by JS: .stat-card elements -->
  </div>

  <!-- Tabs Navigation -->
  <div class="ccc-tabs" style="display:flex; gap:10px; margin-top:20px; border-bottom: 1px solid var(--line);">
    <button class="ccc-tab active" data-tab="eligible" style="padding: 10px 20px; background:none; border:none; color:var(--text-muted); cursor:pointer;">Eligible</button>
    <button class="ccc-tab" data-tab="submitted" style="padding: 10px 20px; background:none; border:none; color:var(--text-muted); cursor:pointer;">Submitted</button>
  </div>

  <!-- Table Viewport -->
  <div class="ccc-table-scroll">
    <div id="tabEligible">
      <table class="ccc-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>Pos</th>
            <th>Contract</th>
            <th>AAV</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="playerDataBody">
          <!-- Dynamically filled by ccc.js -->
        </tbody>
      </table>
    </div>
    <div id="tabSubmitted" style="display:none;"></div>
  </div>
</div>
